aid: expresssteuer-fka-express-group
name: ExpressSteuer (fka Express Group)
description: >-
  ExpressSteuer (formerly Express Group) is a German tax-technology company, originally
  a Hamburg-based fintech backed by Insight Partners that offered an app-based, largely
  automated income-tax-return (Steuererklärung) service aimed at consumers and employees.
  The expresssteuer.de domain currently presents a German-language tax-information and
  guidance website (built on WordPress) covering income tax, self-employment, and everyday
  financial topics. No public developer program, API, SDK, or /.well-known/ discovery
  surface is published. This profile was surfaced as a portfolio company of Insight Partners
  and added to the API Evangelist network as a company lead for enrichment.
